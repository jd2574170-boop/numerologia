<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Numerología API</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f0c20 0%, #1a103c 50%, #2b0938 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: #ffd700;
      text-align: center;
      margin-bottom: 8px;
      font-size: 2.2rem;
    }

    p.subtitle {
      text-align: center;
      color: #b3a0e6;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h2 {
      color: #ff8a00;
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #ccc;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      transition: border-color 0.3s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }

    select option {
      background: #1a103c;
      color: #fff;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #ff8a00, #e52e71);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    button:disabled {
      background: #4a4a5a;
      cursor: not-allowed;
      opacity: 0.5;
      transform: none;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 0.88rem;
      text-align: center;
      min-height: 20px;
    }

    .status-msg.success {
      color: #2ecc71;
    }

    .status-msg.error {
      color: #e74c3c;
    }

    .status-msg.info {
      color: #ffd700;
    }

    #resultArea {
      margin-top: 20px;
      background: rgba(0, 0, 0, 0.35);
      border-left: 4px solid #ffd700;
      padding: 18px;
      border-radius: 8px;
      display: none;
    }

    #resultArea h3 {
      color: #ffd700;
      margin-bottom: 12px;
      font-size: 1.15rem;
    }

    .result-section {
      margin-bottom: 12px;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .result-section strong {
      color: #ff8a00;
      display: block;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔮 Numerología IA</h1>
    <p class="subtitle">Genera tu lectura mística impulsada por Gemini</p>

    <!-- Bloque 1: Autenticación -->
    <section class="card">
      <h2>1. Autenticación</h2>
      <div class="form-group">
        <label for="emailInput">Correo Electrónico</label>
        <input type="email" id="emailInput" placeholder="usuario@ejemplo.com" required>
      </div>
      <div class="form-group">
        <label for="passwordInput">Contraseña</label>
        <input type="password" id="passwordInput" placeholder="******" required>
      </div>
      <button id="loginBtn" type="button" onclick="login()">Iniciar Sesión</button>
      <div id="authStatus" class="status-msg"></div>
    </section>

    <!-- Bloque 2: Generar Lectura -->
    <section class="card">
      <h2>2. Generar Lectura</h2>
      <div class="form-group">
        <label for="tipoLectura">Tipo de Lectura</label>
        <select id="tipoLectura">
          <option value="general">General</option>
          <option value="amor">Amor & Relaciones</option>
          <option value="trabajo">Trabajo & Dinero</option>
        </select>
      </div>
      <button id="generateBtn" type="button" onclick="generarLectura()" disabled>Generar Lectura con IA</button>
      <div id="readingStatus" class="status-msg"></div>

      <!-- Área de Resultados -->
      <article id="resultArea">
        <h3>Resultado de la Lectura</h3>
        <div class="result-section" id="resumenText"></div>
        <div class="result-section" id="fortalezasText"></div>
        <div class="result-section" id="desafiosText"></div>
        <div class="result-section" id="mensajeText"></div>
      </article>
    </section>
  </div>

  <script>
    let tokenJWT = '';

    async function login() {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const authStatus = document.getElementById('authStatus');
      const loginBtn = document.getElementById('loginBtn');
      const generateBtn = document.getElementById('generateBtn');

      if (!email || !password) {
        authStatus.className = 'status-msg error';
        authStatus.textContent = 'Ingresa tu correo y contraseña.';
        return;
      }

      loginBtn.disabled = true;
      authStatus.className = 'status-msg info';
      authStatus.textContent = 'Autenticando...';

      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correo: email, password: password })
        });

        const data = await response.json();

        if (response.ok && (data.token || data.data?.token)) {
          tokenJWT = data.token || data.data.token;
          authStatus.className = 'status-msg success';
          authStatus.textContent = '¡Sesión iniciada con éxito!';
          generateBtn.disabled = false;
        } else {
          authStatus.className = 'status-msg error';
          authStatus.textContent = data.mensaje || data.error || 'Credenciales incorrectas.';
        }
      } catch (err) {
        authStatus.className = 'status-msg error';
        authStatus.textContent = 'Error al conectar con el servidor.';
      } finally {
        loginBtn.disabled = false;
      }
    }

    async function generarLectura() {
      const tipo = document.getElementById('tipoLectura').value;
      const readingStatus = document.getElementById('readingStatus');
      const generateBtn = document.getElementById('generateBtn');
      const resultArea = document.getElementById('resultArea');

      if (!tokenJWT) {
        readingStatus.className = 'status-msg error';
        readingStatus.textContent = 'Debes iniciar sesión primero.';
        return;
      }

      generateBtn.disabled = true;
      readingStatus.className = 'status-msg info';
      readingStatus.textContent = 'Consultando a la IA... Por favor espera.';
      resultArea.style.display = 'none';

      try {
        const response = await fetch('/api/v1/readings/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${tokenJWT}`
          },
          body: JSON.stringify({ tipo_lectura: tipo })
        });

        const data = await response.json();

        if (response.ok) {
          readingStatus.className = 'status-msg success';
          readingStatus.textContent = 'Lectura generada exitosamente.';

          const lectura = data.data?.lectura || data.lectura || data;

          document.getElementById('resumenText').innerHTML = '<strong>Resumen:</strong> ' + (lectura.resumen || 'No disponible');
          document.getElementById('fortalezasText').innerHTML = '<strong>Fortalezas:</strong> ' + (lectura.fortalezas || 'No disponible');
          document.getElementById('desafiosText').innerHTML = '<strong>Desafíos:</strong> ' + (lectura.desafios || 'No disponible');
          document.getElementById('mensajeText').innerHTML = '<strong>Consejo Principal:</strong> ' + (lectura.mensaje_principal || 'No disponible');

          resultArea.style.display = 'block';
        } else {
          readingStatus.className = 'status-msg error';
          readingStatus.textContent = data.mensaje || data.error || 'Error al solicitar la lectura.';
        }
      } catch (err) {
        readingStatus.className = 'status-msg error';
        readingStatus.textContent = 'Error de conexión con la API.';
      } finally {
        generateBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
