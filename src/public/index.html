<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Numerología API</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f0c20 0%, #1a103c 50%, #2b0938 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: #ffd700;
      text-align: center;
      margin-bottom: 8px;
      font-size: 2.2rem;
    }

    p.subtitle {
      text-align: center;
      color: #b3a0e6;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h2 {
      color: #ff8a00;
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #ccc;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #ff8a00, #e52e71);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔮 Numerología IA</h1>
    <p class="subtitle">Genera tu lectura mística impulsada por Gemini</p>

    <!-- Formulario 1: Envia login directamente a la API -->
    <form class="card" action="/api/v1/auth/login" method="POST">
      <h2>1. Autenticación</h2>
      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="usuario@ejemplo.com" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="******" required>
      </div>
      <button type="submit">Iniciar Sesión</button>
    </form>

    <!-- Formulario 2: Envia la solicitud de lectura directamente a la API -->
    <form class="card" action="/api/v1/readings/generate" method="POST">
      <h2>2. Generar Lectura</h2>
      <div class="form-group">
        <label for="tipo_lectura">Tipo de Lectura</label>
        <select id="tipo_lectura" name="tipo_lectura">
          <option value="general">General</option>
          <option value="amor">Amor & Relaciones</option>
          <option value="trabajo">Trabajo & Dinero</option>
        </select>
      </div>
      <button type="submit">Generar Lectura con IA</button>
    </form>
  </div>

</body>
</html>
